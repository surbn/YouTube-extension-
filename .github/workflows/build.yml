name: Build YouTube Custom Echo Extension

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'
      - name: Build extension package
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK to EAPK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/YouTube_Custom.eapk
      - uses: actions/upload-artifact@v4
        with:
          name: YouTube_Custom-eapk
          path: release/YouTube_Custom.eapk
          if-no-files-found: error
